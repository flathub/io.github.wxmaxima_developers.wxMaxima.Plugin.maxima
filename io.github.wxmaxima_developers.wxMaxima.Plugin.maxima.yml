id: io.github.wxmaxima_developers.wxMaxima.Plugin.maxima
runtime: io.github.wxmaxima_developers.wxMaxima
runtime-version: stable
sdk: org.freedesktop.Sdk//24.08
build-extension: true
separate-locales: false
build-options:
  prefix: "/app/plugins/maxima"
  prepend-path: "/app/plugins/maxima/bin"
  append-ld-library-path: "/app/plugins/maxima/lib:/app/plugins/maxima/lib64"
  append-pkg-config-path: "/app/plugins/maxima/lib/pkgconfig:/app/plugins/maxima/lib64/pkgconfig"
  ldflags: "-L/app/plugins/maxima/lib -L/app/plugins/maxima/lib64"
  env:
    C_INCLUDE_PATH: "/app/plugins/maxima/include"
    CPLUS_INCLUDE_PATH: "/app/plugins/maxima/include"
    
modules:
  - name: tcl
    buildsystem: autotools
    subdir: unix
    post-install:
      - chmod 755 /app/plugins/maxima/lib/libtcl9.0.so
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tcl9.0.2-src.tar.gz
        sha256: e074c6a8d9ba2cddf914ba97b6677a552d7a52a3ca102924389a05ccb249b520
  - name: tk
    buildsystem: autotools
    subdir: unix
    post-install:
      - ln -s -r /app/plugins/maxima/bin/wish9.0 /app/plugins/maxima/bin/wish
      - chmod 755 /app/plugins/maxima/lib/libtcl9tk9.0.so
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tk9.0.2-src.tar.gz
        sha256: 76fb852b2f167592fe8b41aa6549ce4e486dbf3b259a269646600e3894517c76
  - name: sbcl
    buildsystem: simple
    no-autogen: true
    build-commands:
      - |
        arch=$(uname -m)
        if [[ $arch == "x86_64" ]] ; then
           tar -xvjf sbcl_x86-64.tar.bz2
           cd sbcl-2.5.6-x86-64-linux
           INSTALL_ROOT=/app/plugins/maxima/ sh install.sh
        else
           ar x sbcl_arm64.deb
           tar -xJf data.tar.xz
           cp -ru ./usr/* /app/plugins/maxima/
        fi
    sources:
      - type: file
        url: http://prdownloads.sourceforge.net/sbcl/sbcl-2.5.6-x86-64-linux-binary.tar.bz2
        sha256: 47bc3d01804507be957a98c1c3ccb0fcca82a0538411113b0ba65c0fdddbf030
        dest-filename: sbcl_x86-64.tar.bz2
        only-arches:
          - x86_64
      - type: file
        url: http://ftp.pl.debian.org/debian/pool/main/s/sbcl/sbcl_2.5.2-1_arm64.deb
        sha256: 5d933768864e8adb88a46709651375ec682751d8b09205eb1f6a815d5f8ba3d3
        dest-filename: sbcl_arm64.deb
        only-arches:
          - aarch64
  - name: maxima
    buildsystem: autotools
    no-autogen: true
    config-opts:
      - --enable-sbcl
    post-install:
      - install -Dm644 --target-directory=${FLATPAK_DEST}/share/metainfo ${FLATPAK_ID}.metainfo.xml
      - ln -s -r /app/plugins/maxima/share/info /app/plugins/maxima/
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/maxima/Maxima-source/5.48.1-source/maxima-5.48.1.tar.gz
        sha256: b0916b5fb37b6eeaae400083175e68e28f80b9a1ab580c106a05448cf1c496b2
      - type: file
        path: io.github.wxmaxima_developers.wxMaxima.Plugin.maxima.metainfo.xml
        
